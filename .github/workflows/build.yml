name: Build HEXED Resolution (ZIP in, .so out)

# Workflow:
#   1. Upload the complete project source as a .zip to the ROOT of the repo.
#   2. Actions -> "Build HEXED Resolution (ZIP in, .so out)" -> Run workflow
#      (it also runs automatically when a .zip is pushed to the repo root).
#   3. Download the "HEXED-Resolution-compiled" artifact: compiled AML .so files
#      for every ABI plus lua/, config/ and docs, ready to copy to the device.
#
# The repo itself only needs this workflow file and the ZIP. Nothing in the
# repo is compiled directly: the ZIP is extracted, compiled with the Android
# NDK, verified, and packaged.

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "ZIP file at the repo root (leave empty to auto-detect the only .zip)"
        required: false
        default: ""
      ndk_version:
        description: "Android NDK version"
        required: false
        default: "r26d"
  push:
    branches: [ main, master ]
    paths:
      - "*.zip"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: ${{ inputs.ndk_version || 'r26d' }}

jobs:
  build:
    name: Extract, compile, verify, package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ 1
      - name: Locate source ZIP
        env:
          ZIP_INPUT: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail
          if [ -n "$ZIP_INPUT" ]; then
            ZIP="$ZIP_INPUT"
            [ -f "$ZIP" ] || { echo "::error::ZIP not found at repo root: $ZIP"; exit 1; }
          else
            mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort)
            if [ "${#ZIPS[@]}" -eq 0 ]; then
              echo "::error::No .zip found at the repo root. Upload the source ZIP there."
              exit 1
            fi
            if [ "${#ZIPS[@]}" -gt 1 ]; then
              echo "::error::Several ZIPs found (${ZIPS[*]}). Run the workflow manually and set 'zip_name'."
              exit 1
            fi
            ZIP="${ZIPS[0]}"
          fi
          echo "Using source ZIP: $ZIP"
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ 2
      - name: Extract ZIP
        run: |
          set -euo pipefail
          # Refuse archives with absolute paths or ".." components (zip-slip).
          if unzip -Z1 "$SOURCE_ZIP" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error::ZIP contains unsafe paths (absolute or '..'). Refusing to extract."
            exit 1
          fi
          EXTRACT_DIR="$RUNNER_TEMP/src"
          rm -rf "$EXTRACT_DIR"; mkdir -p "$EXTRACT_DIR"
          unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"
          rm -rf "$EXTRACT_DIR/__MACOSX"
          echo "Extracted $(find "$EXTRACT_DIR" -type f | wc -l) files."
          echo "EXTRACT_DIR=$EXTRACT_DIR" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ 3
      - name: Detect project root and verify sources
        run: |
          set -euo pipefail
          # The project root is the folder holding Android.mk. This works whether
          # the ZIP has files at its top level or inside one wrapper folder.
          # (Vendored aml-psdk is excluded from the search.)
          mapfile -t HITS < <(
            find "$EXTRACT_DIR" -name Android.mk -not -path '*/aml-psdk/*' \
              | awk -F/ '{print NF "\t" $0}' | sort -n
          )
          if [ "${#HITS[@]}" -eq 0 ]; then
            echo "::error::No Android.mk found in the ZIP. Is this the full project source?"
            exit 1
          fi
          D0=$(printf '%s' "${HITS[0]}" | cut -f1)
          if [ "${#HITS[@]}" -gt 1 ] && [ "$(printf '%s' "${HITS[1]}" | cut -f1)" = "$D0" ]; then
            echo "::error::More than one Android.mk at the same depth; cannot pick a project root."
            printf '%s\n' "${HITS[@]}" | cut -f2
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$(printf '%s' "${HITS[0]}" | cut -f2)")
          echo "Project root: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          MISSING=0
          for f in Android.mk mod/amlmod.h mod/iaml.h aml-psdk/sdk_base.h; do
            [ -f "$PROJECT_ROOT/$f" ] || { echo "::error::Missing required file: $f"; MISSING=1; }
          done
          if ! find "$PROJECT_ROOT" -path "$PROJECT_ROOT/aml-psdk" -prune -o \
                 -path "$PROJECT_ROOT/mod" -prune -o \
                 \( -name '*.cpp' -o -name '*.cc' -o -name '*.c' \) -print -quit | grep -q .; then
            echo "::error::No C/C++ sources found in the project."
            MISSING=1
          fi
          [ "$MISSING" = "0" ] || exit 1
          echo "Required files present."

      # ------------------------------------------------------------------ 4
      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          NDK_DIR="$HOME/android-ndk-${NDK_VERSION}"
          if [ ! -x "$NDK_DIR/build/ndk-build" ]; then
            curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
              "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME"
            rm -f "$RUNNER_TEMP/ndk.zip"
          fi
          [ -x "$NDK_DIR/build/ndk-build" ] || { echo "::error::NDK install failed: $NDK_DIR"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ 5
      - name: Compile with ndk-build
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          ARGS=(
            NDK_PROJECT_PATH="$PROJECT_ROOT"
            APP_BUILD_SCRIPT="$PROJECT_ROOT/Android.mk"
            NDK_OUT="$PROJECT_ROOT/build/obj"
            NDK_LIBS_OUT="$PROJECT_ROOT/build/libs"
            NDK_DEBUG=0
          )
          if [ -f Application.mk ]; then
            ARGS+=( NDK_APPLICATION_MK="$PROJECT_ROOT/Application.mk" )
          else
            echo "No Application.mk found; using defaults (armeabi-v7a + arm64-v8a)."
            ARGS+=( APP_ABI="armeabi-v7a arm64-v8a" APP_PLATFORM=android-21 APP_STL=c++_static )
          fi

          # Pipe through tee so a failure still leaves a full log to download.
          "$ANDROID_NDK_HOME/build/ndk-build" "${ARGS[@]}" -j"$(nproc)" 2>&1 | tee "$RUNNER_TEMP/ndk-build.log"

      # ------------------------------------------------------------------ 6
      - name: Verify compiled libraries
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          # ABIs we expect: whatever Application.mk asks for (default: both).
          EXPECTED="armeabi-v7a arm64-v8a"
          if [ -f Application.mk ]; then
            LINE=$(grep -E '^[[:space:]]*APP_ABI[[:space:]]*[:+]?=' Application.mk | tail -1 | sed -E 's/^[^=]*=//' || true)
            if echo "$LINE" | grep -qw all; then
              EXPECTED="armeabi-v7a arm64-v8a x86 x86_64"
            elif [ -n "${LINE// /}" ]; then
              EXPECTED="$LINE"
            fi
          fi
          echo "Expected ABIs: $EXPECTED"

          FAIL=0
          : > "$RUNNER_TEMP/sha256.txt"
          for ABI in $EXPECTED; do
            mapfile -t SOS < <(find "build/libs/$ABI" -maxdepth 1 -name '*.so' ! -name 'libc++_shared.so' 2>/dev/null | sort)
            if [ "${#SOS[@]}" -eq 0 ]; then
              echo "::error::No .so produced for $ABI"; FAIL=1; continue
            fi
            case "$ABI" in
              armeabi-v7a) WANT='ARM$' ;;
              arm64-v8a)   WANT='AArch64' ;;
              x86)         WANT='Intel 80386' ;;
              x86_64)      WANT='X86-64' ;;
              *)           WANT='.' ;;
            esac
            for SO in "${SOS[@]}"; do
              echo "--- $SO ---"
              HDR=$("$READELF" -h "$SO")
              echo "$HDR" | grep -E 'Class:|Machine:'
              if ! echo "$HDR" | grep -E 'Machine:' | grep -Eq "$WANT"; then
                echo "::error::$SO has the wrong architecture for $ABI"; FAIL=1
              fi
              # An AML mod must export __GetModInfo (generated by the MYMOD macros).
              if ! "$READELF" --dyn-syms "$SO" | grep -qw '__GetModInfo'; then
                echo "::error::$SO does not export __GetModInfo; AML will not load it"; FAIL=1
              else
                echo "AML entry points: OK"
              fi
              ( cd "$(dirname "$SO")" && sha256sum "$(basename "$SO")" | sed "s#  # ($ABI)  #" ) >> "$RUNNER_TEMP/sha256.txt"
            done
          done
          [ "$FAIL" = "0" ] || exit 1
          echo "All libraries verified."
          cat "$RUNNER_TEMP/sha256.txt"

      # ------------------------------------------------------------------ 7
      - name: Package result
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/HEXED-Resolution-compiled"
          rm -rf "$STAGE"; mkdir -p "$STAGE/libs"

          # Compiled libraries, one folder per ABI.
          for D in "$PROJECT_ROOT"/build/libs/*/; do
            ABI=$(basename "$D")
            mkdir -p "$STAGE/libs/$ABI"
            find "$D" -maxdepth 1 -name '*.so' ! -name 'libc++_shared.so' -exec cp {} "$STAGE/libs/$ABI/" \;
          done

          # Runtime extras, if the project has them.
          for X in lua config; do
            [ -d "$PROJECT_ROOT/$X" ] && cp -r "$PROJECT_ROOT/$X" "$STAGE/$X" || true
          done
          for X in README.md INSTALL.md TESTING.md LICENSES.md; do
            [ -f "$PROJECT_ROOT/$X" ] && cp "$PROJECT_ROOT/$X" "$STAGE/" || true
          done

          {
            echo "HEXED Resolution build info"
            echo "Source ZIP : $SOURCE_ZIP"
            echo "Commit     : $GITHUB_SHA"
            echo "NDK        : $NDK_VERSION"
            echo "Built at   : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "SHA-256:"
            cat "$RUNNER_TEMP/sha256.txt"
          } > "$STAGE/BUILD-INFO.txt"

          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          ( cd "$STAGE" && find . -type f | sort )

          {
            echo "### HEXED Resolution build"
            echo "Source: \`$SOURCE_ZIP\` | NDK: \`$NDK_VERSION\`"
            echo
            echo '```'
            cat "$RUNNER_TEMP/sha256.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: HEXED-Resolution-compiled
          path: ${{ env.STAGE }}
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ndk-build-log
          path: ${{ runner.temp }}/ndk-build.log
          if-no-files-found: ignore
