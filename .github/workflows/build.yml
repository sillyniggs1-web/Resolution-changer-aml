name: Build HEXED Resolution

# 1. Put the source ZIP at the repo root (only one .zip, or set zip_name).
# 2. Actions -> "Build HEXED Resolution" -> Run workflow (also runs on push of a .zip).
# 3. Download the "HEXED-Resolution-compiled" artifact:
#    libs/armeabi-v7a/libHEXED_Resolution.so + lua/ + docs/ + BUILD-INFO.txt

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "ZIP at the repo root (empty = auto-detect the only .zip)"
        required: false
        default: ""
  push:
    branches: [ main, master ]
    paths: [ "*.zip" ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: r26d

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Extract source ZIP
        env:
          ZIP_INPUT: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail
          ZIP="${ZIP_INPUT:-}"
          if [ -z "$ZIP" ]; then
            mapfile -t Z < <(find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n')
            [ "${#Z[@]}" -eq 1 ] || { echo "::error::Need exactly one .zip at the repo root (found ${#Z[@]}); set zip_name."; exit 1; }
            ZIP="${Z[0]}"
          fi
          [ -f "$ZIP" ] || { echo "::error::ZIP not found: $ZIP"; exit 1; }
          if unzip -Z1 "$ZIP" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error::ZIP has unsafe paths"; exit 1
          fi
          SRC="$RUNNER_TEMP/src"; rm -rf "$SRC"; mkdir -p "$SRC"
          unzip -q "$ZIP" -d "$SRC"; rm -rf "$SRC/__MACOSX"

          # Android.mk = shallowest one (ignoring vendored aml-psdk). It may sit in jni/ or at the root.
          MK=$(find "$SRC" -name Android.mk -not -path '*/aml-psdk/*' | awk -F/ '{print NF" "$0}' | sort -n | head -1 | cut -d' ' -f2-)
          [ -n "$MK" ] || { echo "::error::No Android.mk in ZIP"; exit 1; }
          MKDIR=$(dirname "$MK")
          if [ "$(basename "$MKDIR")" = "jni" ]; then ROOT=$(dirname "$MKDIR"); else ROOT="$MKDIR"; fi
          APPMK="$MKDIR/Application.mk"; [ -f "$APPMK" ] || APPMK=""

          for f in mod/amlmod.h mod/iaml.h; do
            [ -f "$ROOT/$f" ] || { echo "::error::Missing $f (AML headers must be inside the ZIP)"; exit 1; }
          done
          echo "Source: $ZIP | Root: $ROOT | Android.mk: $MK | Application.mk: ${APPMK:-none}"
          { echo "SOURCE_ZIP=$ZIP"; echo "ROOT=$ROOT"; echo "MK=$MK"; echo "APPMK=$APPMK"; } >> "$GITHUB_ENV"

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ~/android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-linux

      - name: Install NDK
        run: |
          set -euo pipefail
          NDK="$HOME/android-ndk-$NDK_VERSION"
          if [ ! -x "$NDK/build/ndk-build" ]; then
            curl -fsSL -o "$RUNNER_TEMP/ndk.zip" "https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME"
          fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      - name: Compile
        run: |
          set -euo pipefail
          cd "$ROOT"
          ARGS=(NDK_PROJECT_PATH="$ROOT" APP_BUILD_SCRIPT="$MK"
                NDK_OUT="$ROOT/build/obj" NDK_LIBS_OUT="$ROOT/build/libs" NDK_DEBUG=0)
          if [ -n "$APPMK" ]; then
            ARGS+=(NDK_APPLICATION_MK="$APPMK")
          else
            ARGS+=(APP_ABI=armeabi-v7a APP_PLATFORM=android-21 APP_STL=c++_static)
          fi
          "$NDK/build/ndk-build" "${ARGS[@]}" -j"$(nproc)" 2>&1 | tee "$RUNNER_TEMP/ndk-build.log"

      - name: Verify
        run: |
          set -euo pipefail
          cd "$ROOT"
          RE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          mapfile -t SOS < <(find build/libs -name '*.so' ! -name 'libc++_shared.so' | sort)
          [ "${#SOS[@]}" -gt 0 ] || { echo "::error::No .so produced"; exit 1; }

          # Every HEXED_* function the Lua declares in ffi.cdef must be exported by the .so,
          # so a Lua/native mismatch fails the build instead of failing in game.
          mapfile -t API < <(grep -rhoE '\bHEXED_[A-Za-z0-9_]+\s*\(' lua 2>/dev/null | sed 's/[ (]//g' | sort -u)
          echo "Lua API to verify (${#API[@]}): ${API[*]:-none}"

          : > "$RUNNER_TEMP/sha256.txt"
          for SO in "${SOS[@]}"; do
            ABI=$(basename "$(dirname "$SO")")
            SYMS=$("$RE" --dyn-syms --wide "$SO")
            echo "== $SO ($ABI)"
            for S in __GetModInfo OnModLoad "${API[@]}"; do
              grep -qw -- "$S" <<< "$SYMS" || { echo "::error::$SO does not export $S"; exit 1; }
            done
            [ "$ABI" != "armeabi-v7a" ] || "$RE" -h "$SO" | grep -Eq 'Machine:\s+ARM$' || { echo "::error::$SO is not 32-bit ARM"; exit 1; }
            ( cd "$(dirname "$SO")" && sha256sum "$(basename "$SO")" | sed "s#  # ($ABI)  #" ) >> "$RUNNER_TEMP/sha256.txt"
          done
          cat "$RUNNER_TEMP/sha256.txt"

      - name: Package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"; rm -rf "$OUT"; mkdir -p "$OUT/libs"
          for D in "$ROOT"/build/libs/*/; do
            A=$(basename "$D"); mkdir -p "$OUT/libs/$A"
            find "$D" -maxdepth 1 -name '*.so' ! -name 'libc++_shared.so' -exec cp {} "$OUT/libs/$A/" \;
          done
          for X in lua docs README.md INSTALL.md; do
            [ -e "$ROOT/$X" ] && cp -r "$ROOT/$X" "$OUT/" || true
          done
          { echo "Source: $SOURCE_ZIP"; echo "Commit: $GITHUB_SHA"; echo "NDK: $NDK_VERSION"
            echo "Built: $(date -u +%FT%TZ)"; echo; echo "SHA-256:"; cat "$RUNNER_TEMP/sha256.txt"; } > "$OUT/BUILD-INFO.txt"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ( cd "$OUT" && find . -type f | sort )

      - uses: actions/upload-artifact@v4
        with:
          name: HEXED-Resolution-compiled
          path: ${{ env.OUT }}
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ndk-build-log
          path: ${{ runner.temp }}/ndk-build.log
          if-no-files-found: ignore
