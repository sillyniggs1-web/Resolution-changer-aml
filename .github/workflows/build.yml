name: Build HEXED Resolution (ZIP → SO)

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate newest source ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          if [[ -z "$ZIP" ]]; then
            echo "::error::No .zip file found in repository root"
            exit 1
          fi
          echo "Found source ZIP: $ZIP"
          echo "zip_file=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/src"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "${{ steps.zip.outputs.zip_file }}" -d "$WORK"

          MK="$(find "$WORK" -type f -path '*/jni/Android.mk' -print -quit)"
          if [[ -z "$MK" ]]; then
            echo "::error::Could not find jni/Android.mk inside the ZIP"
            find "$WORK" -type f | head -50
            exit 1
          fi

          ROOT="\( (dirname " \)(dirname "$MK")")"
          echo "Project root: $ROOT"
          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

          test -f "$ROOT/jni/Android.mk" || { echo "::error::Missing jni/Android.mk"; exit 1; }
          test -f "$ROOT/jni/Application.mk" || { echo "::error::Missing jni/Application.mk"; exit 1; }

          if [[ ! -f "$ROOT/src/main.cpp" ]] && ! find "$ROOT" -type f -name '*.cpp' -print -quit | grep -q .; then
            echo "::error::No .cpp source found"
            exit 1
          fi

      - name: Ensure AML mod headers
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.extract.outputs.project_root }}"
          if [[ ! -f "$ROOT/mod/amlmod.h" ]]; then
            echo "AML headers missing – fetching pinned AndroidModLoader template"
            PINNED=3ef5c918ec855f3db5e3a216dcb176e209b89922
            git clone https://github.com/RusJJ/AndroidModLoader.git "$RUNNER_TEMP/aml"
            git -C "$RUNNER_TEMP/aml" checkout "$PINNED"
            mkdir -p "$ROOT/mod"
            cp -r "$RUNNER_TEMP/aml/template_of_mod/mod/." "$ROOT/mod/"
          else
            echo "AML headers already present in ZIP"
          fi
          test -f "$ROOT/mod/amlmod.h"
          test -f "$ROOT/mod/iaml.h"
          test -f "$ROOT/mod/logger.h"

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Compile with ndk-build
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          ROOT="${{ steps.extract.outputs.project_root }}"
          export PATH="$ANDROID_NDK_HOME:$PATH"

          rm -rf "$ROOT/libs" "$ROOT/obj"
          mkdir -p "$ROOT/libs" "$ROOT/obj"

          ndk-build -C "$ROOT/jni" \
            NDK_PROJECT_PATH="$ROOT" \
            NDK_LIBS_OUT="$ROOT/libs" \
            NDK_OUT="$ROOT/obj" \
            -j"$(nproc)" \
            V=1

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.extract.outputs.project_root }}"
          SO="$(find "$ROOT/libs" -type f -name '*.so' -print -quit)"
          if [[ -z "$SO" ]]; then
            echo "::error::No .so produced"
            find "$ROOT" -type f | head -80
            exit 1
          fi

          echo "Built: $SO"
          file "$SO"
          if ! file "$SO" | grep -qiE 'ELF 32-bit.*ARM'; then
            echo "::error::Output is not a 32-bit ARM shared library"
            exit 1
          fi

          if command -v nm >/dev/null 2>&1; then
            if ! nm -D "$SO" | grep -Eq 'HEXED_SetScale|HEXED_SetSize|HEXED_IsReady|OnModLoad'; then
              echo "::error::Expected HEXED/AML symbols were not found"
              nm -D "$SO" | head -40
              exit 1
            fi
          fi

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.extract.outputs.project_root }}"
          OUT="$RUNNER_TEMP/artifact"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          SO="$(find "$ROOT/libs" -type f -name '*.so' -print -quit)"
          cp -v "$SO" "$OUT/"

          if [[ -f "$ROOT/lua/hexed_resolution.lua" ]]; then
            mkdir -p "$OUT/lua"
            cp -v "$ROOT/lua/hexed_resolution.lua" "$OUT/lua/"
          fi
          if [[ -f "$ROOT/README.md" ]]; then cp -v "$ROOT/README.md" "$OUT/"; fi
          if [[ -f "$ROOT/docs/LIMITATIONS.md" ]]; then
            mkdir -p "$OUT/docs"
            cp -v "$ROOT/docs/LIMITATIONS.md" "$OUT/docs/"
          fi

          cat > "$OUT/INSTALL.txt" <<'NOTE'
          HEXED Resolution - install notes (Nezuko SA-MP 1.0.3 TESTING)

          1. Copy the generated .so into the AML mods folder of the client.
          2. Copy lua/hexed_resolution.lua into the MonetLoader scripts folder.
          3. Launch the game and check logcat: adb logcat -s HEXED_Resolution
          4. In-game commands:
             /hxdres
             /hxdres_pct 0-100
             /hxdres_set 1280 720
             /hxdres_reset

          Changes game rendering resolution only; does not change Android system DPI.
          NOTE

          echo "Artifact contents:"
          find "$OUT" -type f -exec ls -la {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEXED-Resolution-armeabi-v7a
          path: ${{ runner.temp }}/artifact/
          if-no-files-found: error
