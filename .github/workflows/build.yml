name: Build AML mod (ZIP in, .so out)

# Put ONE project .zip in the repo root (e.g. HEXED-Resolution-Source.zip) and push,
# or run this workflow manually from the Actions tab.
on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Find newest ZIP in repo root
        id: zip
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$ZIP" ]; then echo "::error::No .zip found in repository root"; exit 1; fi
          echo "Using: $ZIP"
          echo "name=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract and locate project
        id: proj
        run: |
          rm -rf work && mkdir work
          unzip -q "${{ steps.zip.outputs.name }}" -d work
          MK=$(find work -type f -path '*/jni/Android.mk' | head -n1 || true)
          if [ -z "$MK" ]; then echo "::error::jni/Android.mk not found inside the ZIP"; exit 1; fi
          ROOT=$(dirname "$(dirname "$MK")")
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          find "$ROOT" -maxdepth 2 | head -50

      - name: Ensure AML headers (only if the ZIP lacks them)
        run: |
          ROOT="${{ steps.proj.outputs.root }}"
          if [ -f "$ROOT/mod/amlmod.h" ] && [ -f "$ROOT/mod/iaml.h" ]; then
            echo "AML headers present in ZIP - using them."
          else
            echo "AML headers missing - fetching from RusJJ/AndroidModLoader"
            git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git /tmp/aml
            mkdir -p "$ROOT/mod"
            cp -rn /tmp/aml/mod/. "$ROOT/mod/"
          fi

      - name: Set up Android NDK r26d
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Build (armeabi-v7a)
        run: |
          ROOT="${{ steps.proj.outputs.root }}"
          "${{ steps.ndk.outputs.ndk-path }}/ndk-build" -C "$ROOT/jni" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/out/libs" \
            NDK_OUT="$GITHUB_WORKSPACE/out/obj" \
            -j"$(nproc)"

      - name: Verify .so
        run: |
          SO=$(find out/libs -name '*.so' | head -n1 || true)
          [ -n "$SO" ] || { echo "::error::No .so produced"; exit 1; }
          echo "Built: $SO"
          file "$SO"
          file "$SO" | grep -q 'ELF 32-bit.*ARM' || { echo "::error::Not a 32-bit ARM ELF"; exit 1; }
          SYMS=$(readelf -Ws --dyn-syms "$SO")
          for s in OnModLoad __GetModInfo; do
            echo "$SYMS" | grep -qw "$s" || { echo "::error::Missing required AML export: $s"; exit 1; }
          done
          echo "Exported HEXED_* API:"; echo "$SYMS" | grep -o 'HEXED_[A-Za-z]*' | sort -u || true
          # Warn (not fail) on libs outside the usual Android set
          readelf -d "$SO" | grep NEEDED

      - name: Package
        run: |
          ROOT="${{ steps.proj.outputs.root }}"
          mkdir -p dist
          cp out/libs/armeabi-v7a/*.so dist/
          [ -d "$ROOT/lua" ] && cp -r "$ROOT/lua" dist/ || true
          [ -f "$ROOT/README.md" ] && cp "$ROOT/README.md" dist/ || true
          [ -d "$ROOT/docs" ] && cp -r "$ROOT/docs" dist/ || true
          (cd dist && sha256sum *.so > SHA256.txt)
          cat dist/SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AML-mod-armeabi-v7a
          path: dist/
          if-no-files-found: error
